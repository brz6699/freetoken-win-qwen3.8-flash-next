[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freetoken"
version = "0.1.2"
description = "MoE-offload inference for one consumer GPU + large system RAM (Windows-tuned)"
requires-python = ">=3.12"
dependencies = ["torch"]

[project.scripts]
ft = "freetoken.cli:main"

[tool.setuptools.packages.find]
where = ["package"]
